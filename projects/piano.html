<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }
        .piano{
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .key{
            border: 1px solid black;
            width: 60px;
            height: 200px;
            margin: 2px;
            background-color: white;
            box-shadow: 2px 2px 5px black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Piano - Events</h1>
    <div class="piano">
        <div class="key" data-note="A">A</div>
        <div class="key" data-note="S">S</div>
        <div class="key" data-note="D">D</div>
        <div class="key" data-note="F">F</div>
        <div class="key" data-note="G">G</div>
        <div class="key" data-note="H">H</div>
        <div class="key" data-note="J">J</div>
        <div class="key" data-note="K">K</div>
        <div class="key" data-note="L">L</div>
    </div>
    <audio id="audio-A" src="./u_c58whxla22-a-piano-a4-422104.mp3"></audio>
    <audio id="audio-S" src="./u_c58whxla22-high-c-piano-c5-422108.mp3"></audio>
    <audio id="audio-D" src="./freesound_community-re-d-47160.mp3"></audio>
    <audio id="audio-F" src="./u_c58whxla22-f-piano-f4-422093.mp3"></audio>
    <audio id="audio-G" src="./freesound_community-piano-g-6200.mp3"></audio>
    <audio id="audio-H" src="./u_hfu8vef624-klavier-h-271383.mp3"></audio>
    <audio id="audio-J" src="./u_df365hdxp7-cinematic-piano-note-362716.mp3"></audio>
    <audio id="audio-K" src="./universfield-elegant-piano-logo-153281.mp3"></audio>
    <audio id="audio-L" src="./freesound_community-piano-g-6200.mp3"></audio>
<script>
    const keys=document.querySelectorAll(".key");
    keys.forEach(function(e){
        const note=e.getAttribute("data-note")
        const audio=document.getElementById("audio-"+note)
        e.addEventListener("click",function(){
            audio.currentTime=0;
            audio.play()
        })
        e.addEventListener("mouseover",function(){
            e.style.backgroundColor="lightBlue"
        })
        e.addEventListener("mouseout",function(){
            e.style.backgroundColor="white"
        })
    });
</script>
</body>
</html>
