<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CALBACK HELL 
        //1. CallBack is a function(callback())
        //2. CallBAck is passed as parameter(inside another function)
        function DoHomeWork(subject,callback){
                console.log(`Doing Homework of ${subject}`)
                callback()
        }
        DoHomeWork("Maths",function(){
            console.log("Homework is going on!")
        })
    </script>
</body>
</html>
